[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-agent"
version = "0.1.0"
description = "Academic research, citation verification, structure analysis, and long-form paper writing agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pypdf>=4.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "typer>=0.12.3",
  "uvicorn>=0.30.0",
  "rich>=13.7.1",
  "tenacity>=8.2.3",
  "fpdf2>=2.7.9",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
academic-agent = "academic_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academic_agent = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
